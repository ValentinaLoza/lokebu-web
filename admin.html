<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin pedidos | LOKEBU</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin">
    <h1>Pedidos</h1>
    <div class="bar">
      <input type="password" id="token" placeholder="Clave de administración" autocomplete="off" />
      <button class="save" id="load">Cargar pedidos</button>
      <button class="save" id="refresh" hidden>Actualizar</button>
    </div>
    <div id="msg" class="msg"></div>
    <div class="admin-wrap">
      <table id="tabla" hidden>
        <thead>
          <tr><th>Pedido</th><th>Cliente</th><th>Producto / Total</th><th>Entrega</th><th>Pago</th><th>Estado</th><th>Seguimiento Correo</th><th></th></tr>
        </thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
