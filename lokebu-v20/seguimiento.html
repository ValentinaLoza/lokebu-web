<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Seguimiento de pedido | LOKEBU</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="checkout.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="LOKEBU inicio"><span>lokebu</span><i></i></a>
      <a class="text-link" href="index.html">← Volver a la tienda</a>
    </div>
  </header>

  <main class="section-pad">
    <div class="track-wrap">
      <div class="track-card">
        <span class="eyebrow">SEGUIMIENTO</span>
        <h1>¿Dónde está tu pedido?</h1>
        <form class="track-form" id="track-form" novalidate>
          <label>Número de pedido
            <input type="text" name="id" placeholder="LK-2610-ABC123" autocomplete="off" required />
          </label>
          <label>WhatsApp con el que hiciste el pedido
            <input type="tel" name="tel" placeholder="11 1234 5678" autocomplete="tel" required />
          </label>
          <button class="btn btn-dark btn-xl btn-block" type="submit">Ver estado</button>
          <p class="track-err" id="track-err" hidden></p>
        </form>

        <div class="track-result" id="track-result" hidden>
          <div class="track-estado" id="tr-estado"></div>
          <div class="track-sub" id="tr-sub"></div>
          <ol class="track-steps" id="tr-steps"></ol>
        </div>
      </div>
    </div>
  </main>

  <script src="seguimiento.js"></script>
</body>
</html>
