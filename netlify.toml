[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Que la configuración compartida de la tienda viaje con las funciones.
  included_files = ["tienda-config.js"]

# Encabezados de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Páginas privadas o de proceso: Google no las indexa.
[[headers]]
  for = "/checkout.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/seguimiento.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Las fotos casi no cambian: el navegador las guarda una semana (la página carga más rápido).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# El panel de administración no se indexa ni se guarda en caché.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# No publicar archivos internos del proyecto.
[[redirects]]
  from = "/marketing/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/readme.txt"
  to = "/404.html"
  status = 404
  force = true
